name: Deploy Production
on:
    push:
        branches:
            - main
    workflow_dispatch:
        inputs:
            ref:
                description: 'Branch, tag, or commit to deploy'
                required: true
                default: 'main'
permissions:
    contents: read
jobs:
    deploy:
        # Linux builder ONLY. The bare [self-hosted, apexos-builder] label set
        # also matches the ARM64 builder, which is a macOS workstation -- and
        # this job writes SSH key material and runs a PRODUCTION deploy. It must
        # never be scheduled there.
        runs-on: [self-hosted, apexos-builder, linux, X64]
        environment: production
        steps:
            - name: Checkout selected ref
              uses: actions/checkout@v5
              with:
                  ref: ${{ github.event.inputs.ref }}
            - name: Capture commit
              id: meta
              run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            - name: Check backend syntax
              run: |
                  node --check server.js
            # Key material goes in $RUNNER_TEMP, NOT ~/.ssh. On a GitHub-hosted
            # runner ~ belonged to a VM that was destroyed minutes later; on a
            # self-hosted runner ~ is the runner account's real, persistent home,
            # shared by every job of every repo that lands on the box. Writing
            # ~/.ssh/id_ed25519 there (a) OVERWRITES that account's own default
            # SSH identity, and (b) leaves this production VPS private key on
            # disk after the job ends, readable by whatever runs next.
            #
            # known_hosts is written fresh per job instead of appended, so the
            # file can't grow without bound or be corrupted by two jobs
            # appending at once.
            #
            # The key is passed through `env:` rather than interpolated into the
            # script body: `RAW_KEY='${{ secrets.VPS_SSH_KEY }}'` breaks outright
            # on a key containing a single quote, and it writes the secret into
            # the step's temporary .sh file on the runner's disk.
            - name: Setup SSH
              env:
                  RAW_KEY: ${{ secrets.VPS_SSH_KEY }}
                  VPS_PORT: ${{ secrets.VPS_PORT }}
                  VPS_HOST: ${{ secrets.VPS_HOST }}
              run: |
                  set -eu
                  umask 077
                  KEY="$RUNNER_TEMP/vps_key"
                  KH="$RUNNER_TEMP/vps_known_hosts"

                  if printf "%s" "$RAW_KEY" | grep -q '\\n'; then
                    printf "%b" "$RAW_KEY" | tr -d '\r' > "$KEY"
                  else
                    printf "%s" "$RAW_KEY" | tr -d '\r' > "$KEY"
                  fi

                  if ! grep -Eq 'BEGIN (OPENSSH|RSA|EC|DSA) PRIVATE KEY' "$KEY"; then
                    echo "VPS_SSH_KEY is not a valid private key. Paste the private key file contents, not the .pub key."
                    exit 1
                  fi

                  chmod 600 "$KEY"
                  ssh-keygen -y -f "$KEY" >/dev/null
                  ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" > "$KH"

                  # IdentitiesOnly stops ssh from also offering the runner
                  # account's own keys from its agent/default paths.
                  echo "SSH_OPTS=-i $KEY -o UserKnownHostsFile=$KH -o IdentitiesOnly=yes" >> "$GITHUB_ENV"
            - name: Ensure VPS app directory exists
              run: |
                  ssh $SSH_OPTS -p "${{ secrets.VPS_PORT }}" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
                    "mkdir -p '${{ secrets.VPS_APP_DIR }}'"
            # Same reason as the key above: a multi-line secret interpolated into
            # the script body as a shell literal breaks on any quote it contains.
            - name: Upload production env file
              env:
                  RAW_ENV: ${{ secrets.PORTAL_ENV_FILE }}
              run: |

                  if [ -z "$RAW_ENV" ]; then
                    echo "PORTAL_ENV_FILE secret is missing"
                    exit 1
                  fi

                  ENV_FILE="$RUNNER_TEMP/cloud-connect.env"
                  if printf "%s" "$RAW_ENV" | grep -q '\\n'; then
                    printf "%b" "$RAW_ENV" | tr -d '\r' > "$ENV_FILE"
                  else
                    printf "%s" "$RAW_ENV" | tr -d '\r' > "$ENV_FILE"
                  fi

                  scp $SSH_OPTS -P "${{ secrets.VPS_PORT }}" "$ENV_FILE" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_APP_DIR }}/.env"
                  ssh $SSH_OPTS -p "${{ secrets.VPS_PORT }}" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
                    "chmod 600 '${{ secrets.VPS_APP_DIR }}/.env'"
            - name: Generate frps.toml from template
              env:
                  FRPS_AUTH_TOKEN: ${{ secrets.FRPS_AUTH_TOKEN }}
                  FRPS_DASHBOARD_PASSWORD: ${{ secrets.FRPS_DASHBOARD_PASSWORD }}
              run: |
                  if [ -z "$FRPS_AUTH_TOKEN" ] || [ -z "$FRPS_DASHBOARD_PASSWORD" ]; then
                    echo "FRPS_AUTH_TOKEN and FRPS_DASHBOARD_PASSWORD secrets must be set"
                    exit 1
                  fi
                  envsubst '$FRPS_AUTH_TOKEN $FRPS_DASHBOARD_PASSWORD' < frps.toml.example > frps.toml
            - name: Sync repo to VPS
              run: |
                  # -e was missing entirely: rsync used plain `ssh` with no
                  # identity and no port, so it only ever worked because the
                  # runner account happened to have a usable default key.
                  rsync -az --delete \
                    -e "ssh $SSH_OPTS -p ${{ secrets.VPS_PORT }}" \
                    --exclude ".git/" \
                    --exclude ".env" \
                    --exclude "database.sqlite" \
                    --exclude "node_modules/" \
                    ./ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_APP_DIR }}/"
            - name: Deploy on VPS
              run: |
                  ssh $SSH_OPTS -p "${{ secrets.VPS_PORT }}" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" 'bash -s' <<'EOF'
                  set -euo pipefail
                  APP_DIR="${{ secrets.VPS_APP_DIR }}"
                  DEPLOY_COMMIT="${{ steps.meta.outputs.commit }}"
                  cd "$APP_DIR"
                  npm ci --omit=dev
                  if ! cmp -s "$APP_DIR/Caddyfile" /etc/caddy/Caddyfile; then
                    sudo install -m 644 "$APP_DIR/Caddyfile" /etc/caddy/Caddyfile
                    sudo caddy validate --config /etc/caddy/Caddyfile
                    sudo systemctl reload caddy
                  fi
                  RESTART_FRPS=0
                  if ! cmp -s "$APP_DIR/frps.toml" /etc/frp/frps.toml; then
                    sudo install -m 644 "$APP_DIR/frps.toml" /etc/frp/frps.toml
                    RESTART_FRPS=1
                  fi
                  if ! cmp -s "$APP_DIR/custom_404.html" /etc/frp/custom_404.html; then
                    sudo install -m 644 "$APP_DIR/custom_404.html" /etc/frp/custom_404.html
                    RESTART_FRPS=1
                  fi
                  if [ "$RESTART_FRPS" -eq 1 ]; then
                    sudo systemctl restart frps
                  fi

                  if pm2 describe apex-portal >/dev/null 2>&1; then
                    pm2 restart apex-portal
                  elif pm2 describe server >/dev/null 2>&1; then
                    pm2 delete server
                    pm2 start server.js --name apex-portal
                  else
                    pm2 start server.js --name apex-portal
                  fi

                  if pm2 describe server >/dev/null 2>&1; then
                    pm2 delete server
                  fi

                  printf "%s\n" "$DEPLOY_COMMIT" > "$APP_DIR/.deploy-version"
                  pm2 save
                  sudo systemctl is-active --quiet caddy
                  sudo systemctl is-active --quiet frps
                  pm2 describe apex-portal >/dev/null

                  for attempt in $(seq 1 15); do
                    if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
                      exit 0
                    fi
                    sleep 2
                  done

                  pm2 logs apex-portal --lines 50 --nostream
                  exit 1
                  EOF

            # $RUNNER_TEMP is cleared when a job STARTS, not when it ends, so on
            # a self-hosted runner the key would otherwise sit on disk until the
            # next job on this box happens to run.
            - name: Remove the deploy key from the runner
              if: always()
              run: rm -f "$RUNNER_TEMP/vps_key" "$RUNNER_TEMP/vps_known_hosts" "$RUNNER_TEMP/cloud-connect.env"
